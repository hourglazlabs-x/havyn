name: Build HAVYN shelf
# Downloads every document on the reference shelf from its publisher, checks it (PDF, size, SHA-256, pages),
# attaches the shareable ones (public domain, Creative Commons) to the "shelf" release, then redeploys the app
# so phones can fetch the phone set from HAVYN's own address. Re-runs monthly to pick up publishers' updates;
# a publisher that is down that day doesn't remove its document (last build's checked copy is kept).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated item ids to check (blank = everything, and publish)"
        required: false
        default: ""
      publish:
        description: "With ids: publish what they find and keep every other document as it is"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths: ["shelf/catalog.json", "tools/shelf_fetch.py", ".github/workflows/shelf.yml"]
  schedule:
    - cron: "23 10 1 * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: shelf
  cancel-in-progress: false
jobs:
  shelf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install the PDF checker
        run: python3 -m pip install --quiet --user "pypdf>=5,<7"
      - name: Fetch and check every document
        env:
          SHELF_ONLY: ${{ inputs.only }}
          SHELF_PUBLISH: ${{ inputs.publish && '1' || '' }}
        run: python3 tools/shelf_fetch.py shelf/catalog.json out
      - name: Report
        if: always()
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish to the shelf release
        if: ${{ !inputs.only || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view shelf >/dev/null 2>&1; then
            gh release edit shelf --notes-file out/notes.md
          else
            gh release create shelf --title "HAVYN reference shelf" --notes-file out/notes.md --latest=false
          fi
          existing="$(gh release view shelf --json assets -q '.assets[].name')"
          up=()
          for f in out/release/*; do
            n="$(basename "$f")"
            if grep -qxF "$n" out/changed.txt || ! grep -qxF "$n" <<<"$existing"; then up+=("$f"); fi
          done
          echo "Uploading ${#up[@]} new or changed files (unchanged ones stay as they are)"
          if [ "${#up[@]}" -gt 0 ]; then gh release upload shelf "${up[@]}" --clobber; fi
          for a in $existing; do
            grep -qxF "$a" out/keep.txt || gh release delete-asset shelf "$a" -y
          done
      - name: Redeploy HAVYN with the new shelf
        if: ${{ !inputs.only || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || echo "Pages deploy not started (is GitHub Pages turned on?)"
