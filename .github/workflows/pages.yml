name: Deploy HAVYN FIELD
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml", "tools/shelf_pages.py"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add the phone shelf (served from HAVYN's own address)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/shelf_pages.py app/shelf
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5
