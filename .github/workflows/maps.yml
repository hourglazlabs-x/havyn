# Offline maps: cut the map packs from the Protomaps daily OpenStreetMap build, gather emergency places, and vendor the
# map renderer. Manual (and monthly for fresh map data). Modes: probe (sizes only), vendor, places, packs, all.
name: Maps
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | vendor | places | packs | all"
        required: true
        default: probe
  schedule:
    - cron: "41 9 3 * *"   # monthly: fresh map data and places
permissions:
  contents: write
  actions: write
concurrency:
  group: maps
  cancel-in-progress: false
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode || 'all' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: pmtiles CLI
        run: |
          mkdir -p /tmp/pmt && gh release download -R protomaps/go-pmtiles -p '*_Linux_x86_64.tar.gz' -D /tmp/pmt
          tar -xzf /tmp/pmt/*.tar.gz -C /tmp/pmt && /tmp/pmt/pmtiles version && echo "PMTILES=/tmp/pmt/pmtiles" >> "$GITHUB_ENV"
      - name: Probe
        if: env.MODE == 'probe'
        run: |
          python3 tools/maps_build.py probe
          python3 tools/shelf_probe.py "https://hourglazlabs-x.github.io/havyn/shelf/ATP-4-02.11-First-Aid-2026.pdf"
      - uses: actions/setup-node@v5
        if: env.MODE == 'vendor' || env.MODE == 'all'
        with:
          node-version: 22
      - name: Vendor the map renderer, style, fonts and symbols
        if: env.MODE == 'vendor' || env.MODE == 'all'
        run: node tools/maps_vendor.mjs
      - name: Emergency places (OpenStreetMap)
        if: env.MODE == 'places' || env.MODE == 'all'
        run: python3 tools/maps_build.py places
      - name: Map packs (release "maps")
        if: env.MODE == 'packs' || env.MODE == 'all'
        run: |
          python3 tools/maps_build.py packs
          gh release view maps >/dev/null 2>&1 || gh release create maps --title "HAVYN map packs" --notes "Offline map packs for HAVYN, cut from the Protomaps daily build. Map data © OpenStreetMap contributors (ODbL)."
          old=$(gh release view maps --json assets --jq '.assets[].name')
          gh release upload maps out/*.pmtiles out/maps-index.json --clobber
          keep=$(cd out && ls)
          for a in $old; do echo "$keep" | grep -qx "$a" || gh release delete-asset maps "$a" -y; done
          gh workflow run pages.yml   # publish the new packs on HAVYN's address
      - name: Commit
        if: env.MODE != 'probe' && env.MODE != 'packs'
        run: |
          git config user.name "havyn-maps"; git config user.email "havyn-maps@users.noreply.github.com"
          git add src/maps src/vendor 2>/dev/null || true
          git diff --cached --quiet && echo "nothing new" || (git commit -m "Maps: renderer, style, fonts and places (workflow)" && git pull --rebase && git push)
