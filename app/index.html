<title>HAVYN FIELD</title>

<style>
/* HAVYN FIELD — PS2 void x LABS ANALYTIX white-lab glass. System fonts only. */
:root {
  --bg0: #04050d; --bg1: #0a0e24; --bg2: #141c48;
  --ink: #f3f6ff; --ink2: #c3cbec; --mute: #8590bd;
  --line: rgba(255,255,255,.13); --line2: rgba(255,255,255,.26);
  --glass: rgba(255,255,255,.055); --glass2: rgba(255,255,255,.095);
  --cyan: #5ce8ff; --cyan2: #2fb4ff; --aqua: #a6fff0;
  --ok: #3de58e; --warn: #ffb547; --crit: #ff4d5e; --none: #69739c; --solar: #ffe066;
  --red: #ff3347; --red2: #c2102a;
  --r: 18px;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
body.night {
  --bg0: #000; --bg1: #000; --bg2: #120000;
  --ink: #ff5b4e; --ink2: #e0463b; --mute: #a8382f;
  --line: rgba(255,80,64,.22); --line2: rgba(255,80,64,.42);
  --glass: rgba(255,40,30,.05); --glass2: rgba(255,40,30,.09);
  --cyan: #ff5b4e; --cyan2: #d93a2e; --aqua: #ff7a6e;
  --ok: #ff5b4e; --warn: #ff5b4e; --crit: #ff8a80; --none: #7a2620; --solar: #ff5b4e;
  --red: #ff5b4e; --red2: #8f1a12;
}
html { font: -apple-system-body; font-size: 100%; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--bg0); color: var(--ink);
  font-family: var(--sans); line-height: 1.35; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--cyan); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.lab { font-family: var(--mono); font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- the void ---------- */
.void { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(110% 55% at 50% -5%, #1b2a6e 0%, rgba(20,28,72,.35) 38%, rgba(4,5,13,0) 68%),
    radial-gradient(80% 45% at 50% 108%, #0f2257 0%, rgba(4,5,13,0) 70%),
    linear-gradient(180deg, #04050d 0%, #060920 55%, #04050d 100%); }
.void::before { content: ""; position: absolute; left: -20%; right: -20%; top: 38%; height: 30%;
  background: radial-gradient(50% 50% at 50% 50%, rgba(92,232,255,.10), rgba(92,232,255,0) 70%); filter: blur(8px); }
.void i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: rgba(166,240,255,.75);
  box-shadow: 0 0 8px rgba(92,232,255,.9); opacity: .0; animation: mote 22s linear infinite; }
@keyframes mote { 0% { transform: translate3d(0, 20px, 0); opacity: 0; } 15% { opacity: .8; } 85% { opacity: .6; } 100% { transform: translate3d(14px, -160px, 0); opacity: 0; } }
body.night .void, body.em .void { background: #000; }
body.night .void i, body.night .void::before, body.em .void i, body.em .void::before { display: none; }

/* ---------- shell ---------- */
#app { max-width: 560px; margin: 0 auto; padding: calc(var(--st) + 10px) 16px calc(var(--sb) + 104px); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 0 14px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand svg { width: 26px; height: 26px; }
.brand b { font-weight: 650; letter-spacing: .34em; font-size: .95rem; }
.brand span { font-family: var(--mono); font-size: .66rem; letter-spacing: .2em; color: var(--cyan); margin-left: -4px; }
.ibtn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 14px; border: 1px solid var(--line);
  background: var(--glass); color: var(--ink2); }
.ibtn svg { width: 22px; height: 22px; }
.ibtn.on { color: var(--cyan); border-color: var(--line2); }
.tools { display: flex; gap: 8px; }

/* glass: Frutiger Aero sheen with a thin white mirror edge */
.glass { position: relative; background: linear-gradient(180deg, var(--glass2), var(--glass) 46%, rgba(255,255,255,.02));
  border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.04), 0 14px 34px rgba(0,0,0,.38);
  -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%); }
.glass::before { content: ""; position: absolute; inset: 1px 1px 52% 1px; border-radius: calc(var(--r) - 1px) calc(var(--r) - 1px) 40% 40% / calc(var(--r) - 1px) calc(var(--r) - 1px) 18px 18px;
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0)); pointer-events: none; }
body.night .glass { box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
body.night .glass::before { display: none; }
.panel { padding: 16px; margin: 0 0 12px; }
.panel h3 { margin: 0 0 10px; font-size: .78rem; font-family: var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }

/* ---------- hero ---------- */
.hero { padding: 18px 18px 16px; }
.hero .num { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 2px; }
.hero .big { font-family: var(--mono); font-size: 3.6rem; font-weight: 300; letter-spacing: -.02em; line-height: 1; }
.hero .unit { font-family: var(--mono); letter-spacing: .2em; font-size: .8rem; color: var(--ink2); }
.hero .sub { color: var(--ink2); font-size: .92rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line2);
  font-family: var(--mono); font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); background: rgba(255,255,255,.04); vertical-align: middle; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.chip.crit { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 55%, transparent); }
.chip.heat { color: var(--warn); }
.chip.cyan { color: var(--cyan); }

/* ---------- towers ---------- */
.scene { margin: 2px -8px 8px; }
.scene svg { display: block; width: 100%; height: auto; overflow: visible; }
.tw { transform-box: fill-box; transform-origin: 50% 100%; animation: rise .9s cubic-bezier(.2,.8,.2,1) both, float 7s ease-in-out infinite alternate; }
.tw:nth-of-type(2) { animation-delay: .06s, -1.7s; } .tw:nth-of-type(3) { animation-delay: .12s, -3.4s; } .tw:nth-of-type(4) { animation-delay: .18s, -5.1s; }
@keyframes rise { from { transform: scaleY(.04); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
@keyframes float { from { translate: 0 0; } to { translate: 0 -5px; } }
.twlink { cursor: pointer; }
.twlink:focus-visible { outline: 2px solid var(--cyan); }

/* ---------- rows, lists ---------- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.grid2 .panel { margin: 0; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.kv:first-of-type { border-top: 0; }
.kv span:first-child { color: var(--ink2); }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.035); margin-bottom: 8px; text-decoration: none; color: var(--ink); }
.alert .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--warn); box-shadow: 0 0 10px var(--warn); }
.alert.crit .dot { background: var(--crit); box-shadow: 0 0 10px var(--crit); }
.alert.info .dot { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
.alert small { display: block; color: var(--mute); margin-top: 2px; }
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line);
  background: rgba(255,255,255,.035); color: var(--ink); text-decoration: none; min-height: 56px; }
.li .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none;
  background: linear-gradient(180deg, rgba(92,232,255,.18), rgba(92,232,255,.05)); border: 1px solid rgba(92,232,255,.28); color: var(--cyan); }
.li .ic svg { width: 20px; height: 20px; }
.li .tx { flex: 1; min-width: 0; }
.li .tx b { display: block; font-weight: 600; }
.li .tx small { display: block; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .rt { font-family: var(--mono); color: var(--ink2); text-align: right; font-size: .9rem; }
.li.soon { opacity: .45; }
.li > svg { width: 18px; height: 18px; flex: none; color: var(--mute); }
.btn svg { width: 18px; height: 18px; flex: none; }
.sec { margin: 18px 2px 8px; display: flex; justify-content: space-between; align-items: center; }
.empty { color: var(--mute); padding: 6px 2px 2px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(166,240,255,.55); color: #04121c; font-weight: 650; letter-spacing: .02em; text-decoration: none;
  background: linear-gradient(180deg, #c8fbff 0%, #6fe9ff 48%, #2fb4ff 52%, #57d6ff 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 6px 18px rgba(47,180,255,.32); }
.btn.ghost { background: rgba(255,255,255,.05); color: var(--ink); border-color: var(--line2); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
.btn.red { color: #fff; border-color: rgba(255,140,150,.6); background: linear-gradient(180deg, #ff8090 0%, #ff3347 48%, #d11a33 52%, #ff3347 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 6px 20px rgba(255,51,71,.35); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: .88rem; }
.btn[disabled] { opacity: .45; }
body.night .btn { background: #1a0000; color: var(--ink); border-color: var(--line2); box-shadow: none; }
body.night .btn.red { background: #3a0000; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btnrow .btn { flex: 1; }

/* ---------- tab bar ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 8px 10px calc(var(--sb) + 8px);
  background: linear-gradient(180deg, rgba(6,9,26,.55), rgba(4,5,13,.92)); border-top: 1px solid var(--line);
  -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); }
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1.25fr 1fr 1fr; align-items: end; gap: 4px; }
.tab { display: grid; justify-items: center; gap: 3px; padding: 6px 0 2px; color: var(--mute); text-decoration: none; font-family: var(--mono); font-size: .58rem; letter-spacing: .12em; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--cyan); }
.tab.sos { margin-top: -18px; color: #fff; }
.tab.sos .disc { width: 62px; height: 62px; border-radius: 22px; display: grid; place-items: center; border: 1px solid rgba(255,160,170,.7);
  background: linear-gradient(180deg, #ff8a98 0%, #ff3347 46%, #cf1530 54%, #ff3347 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 8px 24px rgba(255,51,71,.45); }
.tab.sos svg { width: 28px; height: 28px; fill: #fff; stroke: none; }
.tab.sos span { color: var(--red); font-weight: 700; }
body.night .tabbar { background: #000; }
body.night .tab.sos .disc { background: #3a0000; box-shadow: none; border-color: var(--red); }
body.em .tabbar { display: none; }

/* ---------- forms ---------- */
.fld { display: grid; gap: 6px; margin-bottom: 12px; }
.fld > span:first-child { font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.fld input, .fld select, .fld textarea { width: 100%; min-height: 48px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line2);
  background: rgba(0,0,0,.35); color: var(--ink); font-size: 1rem; }
.fld textarea { min-height: 84px; resize: vertical; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(92,232,255,.18); }
.fld .hint { color: var(--mute); font-size: .8rem; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chk { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.chk:first-of-type { border-top: 0; }
.chk input { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; flex: none; margin: 0; border-radius: 8px; border: 1.5px solid var(--line2); background: rgba(0,0,0,.3); display: grid; place-items: center; }
.chk input:checked { background: var(--cyan); border-color: var(--cyan); }
.chk input:checked::after { content: ""; width: 7px; height: 13px; border: solid #04121c; border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); }
.chk .tx b { display: block; font-weight: 600; }
.chk .tx small { color: var(--mute); display: block; margin-top: 2px; }
.chk.done .tx b { color: var(--mute); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 14px; color: var(--ink2); font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; }
.seg button.on { background: var(--cyan); color: #04121c; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
.filters a { flex: none; text-decoration: none; }
.filters .chip.on { background: var(--cyan); color: #04121c; border-color: var(--cyan); }
.toast { position: fixed; left: 50%; bottom: calc(var(--sb) + 112px); transform: translateX(-50%); z-index: 50; padding: 12px 18px; border-radius: 14px;
  background: rgba(10,16,40,.92); border: 1px solid var(--line2); color: var(--ink); font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 90vw; }
.photo { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; margin-top: 8px; }
.danger { color: var(--crit); }

/* ---------- memory card ---------- */
.mc { display: flex; gap: 14px; align-items: center; }
.mc .card { width: 54px; height: 70px; border-radius: 8px; flex: none; position: relative;
  background: linear-gradient(160deg, #e9f2ff, #9fb6d6 55%, #6f86a8); box-shadow: inset 0 1px 0 #fff, 0 6px 16px rgba(0,0,0,.4); }
.mc .card::after { content: "HAVYN"; position: absolute; left: 6px; right: 6px; bottom: 8px; font: 700 .5rem var(--mono); letter-spacing: .14em; color: #23324d; text-align: center; }
.mc .card::before { content: ""; position: absolute; left: 8px; right: 8px; top: 8px; height: 22px; border-radius: 3px; background: repeating-linear-gradient(90deg, #c9a24a 0 4px, #8a6a20 4px 6px); opacity: .85; }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan2), var(--cyan)); transition: width .5s ease; }

/* ---------- EMERGENCY MODE: no animation, white on black, big type ---------- */
body.em { background: #000; --ink: #fff; --ink2: #e6e6e6; --mute: #bdbdbd; --line: rgba(255,255,255,.35); --line2: rgba(255,255,255,.6); }
body.em *, body.em *::before, body.em *::after { animation: none !important; transition: none !important; }
body.em #app { padding-bottom: calc(var(--sb) + 20px); }
.emtop { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.emtop .exit { min-height: 52px; padding: 0 18px; border-radius: 14px; border: 2px solid #fff; background: #000; color: #fff; font-weight: 800; font-size: 1.05rem; letter-spacing: .06em; text-decoration: none; display: inline-flex; align-items: center; }
.emtop .call { min-height: 52px; padding: 0 20px; border-radius: 14px; border: 0; background: var(--red); color: #fff; font-weight: 900; font-size: 1.2rem; letter-spacing: .04em; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.emtop .call svg { width: 22px; height: 22px; }
.emgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.emtile { min-height: 96px; border: 2px solid #fff; border-radius: 16px; background: #000; color: #fff; text-decoration: none; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; }
.emtile b { font-size: 1.45rem; font-weight: 850; letter-spacing: .01em; line-height: 1.1; }
.emtile small { color: #cfcfcf; font-size: .85rem; line-height: 1.2; }
.emtile svg { width: 26px; height: 26px; }
.emtile.red { background: var(--red); border-color: var(--red); }
.emhead { font-size: 1rem; color: #cfcfcf; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; }
.emstep { font-size: 2.05rem; font-weight: 850; line-height: 1.12; margin: 12px 0 12px; letter-spacing: -.01em; }
.emdet { font-size: 1.45rem; line-height: 1.3; color: #fff; font-weight: 500; }
.emnote { margin-top: 16px; padding: 12px 14px; border: 2px solid #fff; border-radius: 14px; font-size: 1.1rem; }
.emnav { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 20px; }
.emnav button, .emnav a { min-height: 72px; border-radius: 16px; font-size: 1.35rem; font-weight: 850; border: 2px solid #fff; background: #000; color: #fff; text-decoration: none; display: grid; place-items: center; }
.emnav .next { background: #fff; color: #000; }
.emsrc { margin-top: 18px; font-size: .95rem; color: #d0d0d0; line-height: 1.4; }
.emsrc a { color: #fff; }
.emlink svg { width: 22px; height: 22px; margin-right: 8px; }
.emlink { margin-top: 14px; display: inline-flex; min-height: 56px; padding: 0 18px; border-radius: 14px; background: var(--red); color: #fff; font-weight: 850; font-size: 1.2rem; align-items: center; text-decoration: none; }
.dots { display: flex; gap: 6px; margin-top: 8px; }
.dots i { flex: 1; height: 6px; border-radius: 3px; background: #444; }
.dots i.on { background: #fff; }
.beat { margin: 18px auto 6px; width: 190px; height: 190px; border-radius: 50%; border: 6px solid #fff; display: grid; place-items: center; text-align: center; }
.beat b { font-size: 2.2rem; font-weight: 900; letter-spacing: .06em; }
.beat small { display: block; font-size: 1rem; color: #ddd; }
.beat.hit { background: #fff; color: #000; }
.beat.hit small { color: #000; }
.cprbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: 1.1rem; }
.cprbar button { min-height: 52px; padding: 0 16px; border-radius: 14px; border: 2px solid #fff; background: #000; color: #fff; font-weight: 800; }
.swap { color: #000; background: #fff; border-radius: 10px; padding: 6px 10px; font-weight: 900; }
body.night.em { --ink: #fff; }

@media (prefers-reduced-motion: reduce) {
  .tw, .void i { animation: none !important; }
  .bar i { transition: none; }
}
@media (min-width: 420px) { .emstep { font-size: 2.25rem; } }

/* ---------- v1.1: missions, buy list, plan, comms ---------- */
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ph h3 { margin-bottom: 10px; }
.ph .rt { font-family: var(--mono); font-size: .78rem; color: var(--ink2); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.ph .rt svg { width: 14px; height: 14px; }
.when { color: var(--mute); letter-spacing: .06em; text-transform: none; font-weight: 500; }
.gate { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 1px dashed color-mix(in srgb, var(--ok) 50%, transparent); color: var(--ink2); font-size: .9rem; }
.gate svg { width: 18px; height: 18px; flex: none; color: var(--ok); margin-top: 1px; }
.gate small { display: block; color: var(--mute); margin-top: 2px; }
.gate.done { border-style: solid; background: color-mix(in srgb, var(--ok) 10%, transparent); color: var(--ok); }
.seg.wide { display: flex; width: 100%; }
.seg.wide > * { flex: 1; text-align: center; }
.seg a { padding: 11px 14px; color: var(--ink2); font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; text-decoration: none; }
.seg a.on { background: var(--cyan); color: #04121c; }
.seg button { min-height: 42px; }
.li.got .tx b { color: var(--ink2); }
.li .rt .chip { margin-top: 5px; }
.step { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.step:first-of-type { border-top: 0; }
.step .n { width: 26px; height: 26px; border-radius: 9px; flex: none; display: grid; place-items: center; font: 600 .78rem var(--mono); color: var(--cyan); border: 1px solid rgba(92,232,255,.35); background: rgba(92,232,255,.08); }
.step b { display: block; font-weight: 600; }
.step small { display: block; color: var(--ink2); margin-top: 3px; line-height: 1.4; }
.blk { padding: 10px 0; border-top: 1px solid var(--line); }
.blk:first-of-type { border-top: 0; }
.blk b { display: block; font-weight: 600; }
.blk small { display: block; color: var(--mute); margin-top: 2px; }
.blk span { display: block; color: var(--ink2); margin-top: 3px; line-height: 1.4; }
.note { color: var(--ink2); font-size: .9rem; margin: 10px 0 0; line-height: 1.4; }
.big2 { display: block; font-size: 1.12rem; font-weight: 650; margin: -2px 0 4px; }
.up p { margin: 0 0 10px; color: var(--ink2); font-size: .92rem; line-height: 1.4; }
.upk { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.upk small { color: var(--mute); }
.dates { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 10px; }

/* ---------- v1.1: PDF reader ---------- */
body.reader .tabbar { display: none; }
body.reader #app { padding-top: 0; padding-bottom: calc(var(--sb) + 24px); max-width: 900px; }
.rhead { position: sticky; top: 0; z-index: 6; margin: 0 -16px 10px; padding: calc(var(--st) + 8px) 16px 10px;
  background: linear-gradient(180deg, rgba(4,5,13,.97), rgba(4,5,13,.9)); border-bottom: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
body.night .rhead { background: #000; }
.rhead .top { margin: 0 0 8px; }
.rtitle { flex: 1; min-width: 0; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rpg { color: var(--ink2); font-size: .85rem; white-space: nowrap; }
.rbar { display: flex; gap: 8px; align-items: center; }
.rgo { display: flex; gap: 6px; flex: 1; min-width: 0; }
.rgo input { width: 100%; min-width: 0; min-height: 44px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line2); background: rgba(0,0,0,.35); color: var(--ink); font-size: 1rem; }
.pgwrap { overflow-x: auto; margin: 0 -16px; padding: 0 8px; -webkit-overflow-scrolling: touch; }
.pdfv { width: calc(100% * var(--z, 1)); margin: 0 auto; }
.pg { width: 100%; background: #fff; border-radius: 3px; margin: 0 0 10px; box-shadow: 0 6px 20px rgba(0,0,0,.45); overflow: hidden; }
.pg canvas { display: block; width: 100%; height: auto; }
body.night .pg { background: #000; }
body.night .pg canvas { filter: invert(1) sepia(1) saturate(5) hue-rotate(-50deg) brightness(.8); }
.toc { display: grid; max-height: 52vh; overflow: auto; }
.toc button { text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 11px 10px; color: var(--ink); font-size: .95rem; line-height: 1.35; }
.toc button:first-child { border-top: 0; }
.toc button b { font-family: var(--mono); color: var(--cyan); margin-right: 8px; font-weight: 600; }

/* ---------- v1.2: binder (paper preview + print) ---------- */
.paper { background: #fff; color: #111; border-radius: 6px; padding: 22px 18px; margin: 14px 0 0; box-shadow: 0 10px 30px rgba(0,0,0,.45); font-size: .92rem; line-height: 1.4; }
.paper h1 { font-size: 1.5rem; letter-spacing: .14em; margin: 0 0 4px; }
.paper h2 { font-size: 1.12rem; margin: 22px 0 6px; padding-top: 10px; border-top: 2px solid #111; }
.paper h3 { font-size: .98rem; margin: 12px 0 4px; }
.paper .meta, .paper .sub2, .paper .src2 { color: #555; font-size: .82rem; margin: 2px 0 6px; }
.paper table { width: 100%; border-collapse: collapse; }
.paper th, .paper td { text-align: left; vertical-align: top; padding: 5px 6px 5px 0; border-bottom: 1px solid #ddd; }
.paper th { width: 40%; font-weight: 650; }
.paper ol, .paper ul { margin: 6px 0; padding-left: 22px; }
.paper li { margin: 3px 0; }
.paper .leave { border: 2px solid #111; padding: 8px 10px; border-radius: 6px; }
@media print {
  body, body.night, body.em { background: #fff !important; color: #000 !important; }
  .void, .tabbar, .toast, .noprint { display: none !important; }
  #app { max-width: none; padding: 0; }
  .paper { box-shadow: none; border-radius: 0; padding: 0; margin: 0; font-size: 11pt; }
  .paper .pb { break-before: page; }
}

        { t: "Not breathing normally: 2 rescue breaths first", d: "Tilt the head back, lift the chin, pinch the nose, seal your mouth over theirs. 1 second each, enough to make the chest rise. Baby: cover the nose and mouth with your mouth. Not trained or can't give breaths? Skip to pushes." },
        { t: "Then CPR: 30 pushes, 2 breaths", d: "Hard and fast in the center of the chest. Keep going until they breathe or help takes over. If you can't give breaths, push anyway.", beat: 110, link: "cpr" },
        { t: "AED as soon as one arrives", d: "Quickly wipe the chest dry, put the pads on, follow its voice. Keep CPR going until it's ready." },
        { t: "Breathing again: on their side, then the ER", d: "Anyone who needed breaths or CPR after being in the water needs a hospital check, even if they seem fine." }
      ],
      note: "Child CPR depth and hand position are on the CPR child card.", noteLink: "cprchild",
      sources: [

        { n: "AHA 2025: special circumstances of resuscitation (drowning)", u: "https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/adult-and-pediatric-special-circumstances-of-resuscitation" },
        { n: "Red Cross: drowning resuscitation guidelines", u: "https://guidelines.redcross.org/guidelines-database/drowning-process-resuscitation/" },
        { n: "AAP (HealthyChildren): CPR for drowning, updated guidance", u: "https://www.healthychildren.org/English/news/Pages/cpr-for-drowning-updated-guidance.aspx" }
      ]
    },

        { t: "Give naloxone (Narcan)", d: "Nasal spray: tip in one nostril, press the plunger all the way. Don't wait to be sure it's opioids." },

    {
      id: "asthma", title: "Asthma attack", sub: "Wheezing, can't catch their breath", icon: "lungs",
      steps: [

        { t: "Sit them upright and stay with them", d: "Keep them calm. Loosen anything tight around the chest or neck." },
        { t: "Help them use their rescue inhaler", d: "Their own quick-relief inhaler, with a spacer if they have one, as their asthma action plan says. No inhaler? Call 911." },
        { t: "Call 911 for any danger sign", d: "Lips or nails blue or gray, struggling to breathe (hunched over, ribs showing), can't walk or talk well, very sleepy or confused, or the inhaler isn't helping." },

    {

      steps: [
        { t: "Passed out, seizing or can't swallow? Nothing by mouth", d: "Food or drink can choke them. Call 911 now." },
        { t: "Give their glucagon if they have it", d: "Follow the kit. Turn them on their side; they may throw up. Not awake in 15 minutes: a second dose if you have one." },
        { t: "Awake and can swallow? 15 grams of fast sugar", d: "Glucose tablets or gel (check the label for 15 g), 1/2 cup of juice or regular soda, or 1 tablespoon of sugar or honey." },
        { t: "Wait 15 minutes, then check again", d: "Still low, or the meter reads under 70: another 15 grams. No better, or worse: call 911." },
        { t: "Back to normal: eat a meal or snack", d: "Not mealtime? Protein and carbs, like cheese and crackers." },

        { n: "ADA: hypoglycemia (low blood glucose)", u: "https://diabetes.org/living-with-diabetes/hypoglycemia-low-blood-glucose" },

    {

      steps: [
        { t: "Call Poison Control", d: "1-800-222-1222, free and open 24/7. Most stings are handled safely at home with their help. Children are at higher risk: call right away.", call: { n: "Poison Control", num: "1-800-222-1222" } },
        { t: "Call 911 for trouble breathing", d: "Also chest pain, swelling of the face or throat, or hives.", link: "anaphylaxis" },
        { t: "Serious signs at any age: call 911", d: "Wild or jerky eye movements, drooling, trouble swallowing or talking, twitching, nonstop crying in a child. Antivenom is given in the hospital." },

        { t: "Call 911", d: "Every bite needs the emergency room; antivenom is given there. Poison Control (1-800-222-1222) can help too." },
        { t: "Keep them calm and still", d: "Walk only if needed to get help or a signal." },
        { t: "Keep the bitten arm or leg still, at heart level or a little lower" },

  playbooks: [
    {
      id: "blackout", title: "Blackout", sub: "Power out at home", icon: "bolt",
      trigger: "The power is out at home, or the utility reports an outage.",
      leave: [
        "Hot weather: an extreme-heat warning and an outage expected past 24 hours.",
        "Hot inside and anyone is an infant, over 65 or chronically ill.",
        "Any sign of heat exhaustion.",
        "A medical device's backup power is running out.",
        "CO alarm: outside immediately, then follow the CO card."
      ],
      phases: [
        { label: "First 10 minutes", items: [
          { t: "Start the outage clock", d: "Status switches to consumption mode: run-out dates use what you log.", act: "outage-start" },
          { t: "Check on everyone", d: "Anyone on powered medical equipment switches to its backup battery now." },
          { t: "Keep the fridge and freezer shut", d: "Closed fridge: food stays safe about 4 hours. Full freezer about 48 hours, half full about 24.", s: "cdcfood" },
          { t: "Text family, don't call", d: "Texts get through busy networks more often than calls. 911 is always a call. Phones on Low Power Mode.", s: "fcc" },
          { t: "Flashlights and headlamps, not candles", s: "cdcpo" },
          { t: "Unplug appliances and electronics", d: "Power can come back with surges. Leave one lamp switched on so you know when it returns.", s: "fema" }
        ]},
        { label: "First hour", items: [
          { t: "Check the outage map or alerts while data works", d: "Cell towers run on backup batteries, often only a few hours." },
          { t: "Text your out-of-area contact: OK + location", d: "Family plan, then Contacts." },
          { t: "Confirm check-in times: 08:00, 12:00, 18:00", d: "5 minutes each. Radios off in between to save battery." },
          { t: "Summer: open the Heat playbook now", go: "heat" },
          { t: "If you have a waterBOB, fill it now", d: "While the water pressure holds." }
        ]},
        { label: "First day", items: [
          { t: "Fridge food: toss after 4 hours without power", d: "Meat, fish, eggs, milk, leftovers, cut fruit and vegetables, unless you had a cold source. When in doubt, throw it out.", s: "cdcfood" },
          { t: "Above 90°F, don't leave food out more than 1 hour", s: "usda" },
          { t: "Generators, grills, camp stoves: outdoors only", d: "Never indoors, in a garage, carport or basement, even with doors open. Generator at least 20 ft from doors, windows and vents, exhaust pointed away.", s: "co" },
          { t: "Charge from the power station or a car parked outside", d: "Never run a car in a garage, even with the door open.", s: "cpsc" },
          { t: "Drink what you need. Don't ration water", d: "Unless the authorities tell you to. In very hot weather, needs can double.", s: "readywater" },
          { t: "Check on family and neighbors", d: "Older adults and young children are most at risk from heat.", s: "fema" }
        ]},
        { label: "Days 2 to 14", items: [
          { t: "Log what you use in Supplies", d: "Status then shows real run-out dates." },
          { t: "Freezer food: refreeze only if it still has ice crystals or is 40°F or colder", s: "cdcfood" },
          { t: "Water or sewer down? Switch to the bucket toilet kit" },
          { t: "Refrigerated medicine: keep using life-sustaining drugs like insulin until you get a new supply", d: "Check the label or ask a pharmacist how long it lasts unrefrigerated.", s: "cdcpo" },
          { t: "Every summer morning: check the leave-now rule" }
        ]}
      ],
      sources: ["cdcfood", "usda", "co", "cpsc", "cdcpo", "fcc", "fema", "readywater"]
    },
    {
      id: "heat", title: "Extreme heat", sub: "Phoenix summer, power or AC out", icon: "sun",
      trigger: "A National Weather Service heat warning, or the house is heating up with no AC.",
      leave: [
        "Extreme-heat warning and an outage expected past 24 hours.",
        "Hot inside and anyone is an infant, over 65 or chronically ill.",
        "Any sign of heat exhaustion that isn't improving.",
        "Go early, in daylight, to a place you arranged in advance."
      ],
      phases: [
        { label: "Now", items: [
          { t: "Confirm where you would go", d: "Family on another grid, a hotel, a cooler town. Public cooling centers hold only a small share of the city." },
          { t: "Cut heat gain", d: "Close blinds and curtains on sun-facing windows. Reflective covers if you have them." },
          { t: "Live in the coolest room", d: "Lowest, most interior room. No oven. No hard work at midday." },
          { t: "Drink water regularly", d: "Don't wait until you are thirsty.", s: "cdcoa" },
          { t: "Check everyone twice a day", d: "Especially infants, anyone over 65 and anyone chronically ill.", s: "cdcoa" },
          { t: "Never leave anyone in a parked car", d: "Children and pets included.", s: "cdckc" }
        ]},
        { label: "If it keeps getting hotter", items: [
          { t: "Above 90°F indoors, fans can make it worse", d: "A fan can raise body temperature then. Use cool showers or baths and wet cloths.", s: "cdcab" },
          { t: "Batteries can't run air conditioning", d: "Save the power station for phones, lights, radios and medical devices." },
          { t: "Car AC as a short refuge", d: "Parked outdoors only. Never in a garage.", s: "cpsc" }
        ]},
        { label: "Know the signs", items: [
          { t: "Heat exhaustion", d: "Heavy sweating; cold, pale, clammy skin; fast weak pulse; nausea; cramps; tiredness; dizziness; headache; fainting. Move somewhere cooler, loosen clothes, cool wet cloths, sip water. Get help if they vomit, get worse, or it lasts over 1 hour.", s: "cdcillness" },
          { t: "Heat stroke: 911", d: "103°F or higher; hot, red, dry or damp skin; fast strong pulse; confusion; passing out. Any confusion counts. Call 911 and cool them now.", s: "cdcillness", card: "heatstroke" }
        ]}
      ],
      sources: ["cdcillness", "cdcoa", "cdckc", "cdcab", "cpsc"]
    },
    {
      id: "storm", title: "Monsoon and dust storm", sub: "Dust walls, flash floods, lightning, outages", icon: "wind",
      trigger: "A dust storm or flash flood warning, or a monsoon storm on the way (mostly June to September).",
      leave: ["Officials say GO for your area.", "Water is rising toward the house: get to higher ground by a dry route.", "Trapped? Get to the highest point, not a closed attic, and call 911.", "Never leave by driving or walking into floodwater."],
      sources: ["adot", "nwsflood", "nwsflooddur", "readyfloods", "nwslightning", "srp", "tep", "maricopa"],
      phases: [
        { label: "Before it hits", items: [
          { t: "Charge phones, power banks and the station", d: "Storms often knock the power out.", go: "blackout" },
          { t: "Don't drive into a dust storm", d: "At home, wait it out. On the road, exit or pull completely off the pavement before it reaches you.", s: "adot" }
        ] },
        { label: "Driving in dust: Pull Aside, Stay Alive", items: [
          { t: "Check traffic around you and slow down", s: "adot" },
          { t: "Exit the highway if you can, or pull completely off the pavement", d: "Do it before visibility drops. Don't stop in a travel lane or the emergency lane.", s: "adot" },
          { t: "Turn off all lights, flashers included", d: "Cars behind you can follow your lights and crash into you.", s: "adot" },
          { t: "Set the parking brake and take your foot off the brake pedal", s: "adot" },
          { t: "Stay in the car, buckled, until the storm passes", s: "adot" }
        ] },
        { label: "Flash floods", items: [
          { t: "Turn around, don't drown", d: "Never drive or walk into floodwater or around barricades. 6 inches of fast water can knock an adult over; 12 inches can carry away most cars; 18 to 24 inches, most SUVs and trucks.", s: "nwsflood" },
          { t: "Get to higher ground and stay out of washes", s: "nwsflooddur" },
          { t: "Car stuck in moving water: stay inside", d: "Water rising inside? Get on the roof and call 911.", s: "readyfloods" }
        ] },
        { label: "Lightning", items: [
          { t: "When thunder roars, go indoors", d: "A building with wiring and plumbing, or a hard-topped car with the windows up. Not a patio, shed or tent.", s: "nwslightning" },
          { t: "Stay in until 30 minutes after the last thunder", s: "nwslightning" }
        ] },
        { label: "If the power goes out", items: [
          { t: "Keep away from fallen power lines", d: "Treat every line as live. Call 911, then your electric company (numbers are in Comms).", s: "srp", href: "#/comms" },
          { t: "Power line on your car: stay inside", d: "Call 911 and keep others away. If the car catches fire, jump clear without touching the car and the ground at the same time, land with feet together and shuffle away.", s: "tep" },
          { t: "Turn off lights and appliances", d: "Avoids a surge when the power comes back.", s: "srp" },
          { t: "Run the blackout playbook", go: "blackout", act: "outage-start" }
        ] }
      ]
    },
    {
      id: "smoke", title: "Wildfire smoke or evacuation", sub: "Clean air inside; Ready, Set, Go to leave", icon: "flame",
      trigger: "Smoke in the air, an air-quality alert, or a fire near you with READY, SET or GO notices.",
      leave: ["GO is announced for your area: leave right away, with the pets.", "Danger is close and life-threatening, with or without an order.", "Smoke is making someone's breathing hard and you can't keep a clean room: move somewhere with clean air."],
      sources: ["azein", "maricopa", "mcnotify", "epasmoke", "epasmoke2", "epaheatsmoke", "epacleanroom", "epadiy", "epalungs", "cdcsmokeheart"],
      phases: [
        { label: "READY: now", items: [
          { t: "Sign up for Maricopa County alerts", d: "RAVE Alerts at smart911.com, plus the Ready Maricopa app. Evacuation alerts say READY, SET or GO.", s: "mcnotify" },
          { t: "Pack a go-bag for each person", d: "Medicines, papers, chargers, water and 3 days of food, cash, pet supplies, and the binder.", s: "azein", href: "#/binder" },
          { t: "Keep NIOSH N95 masks and a HEPA air cleaner", d: "Dust masks, bandanas and cloth masks don't stop smoke.", s: "epasmoke" }
        ] },
        { label: "Smoke: protect your lungs", items: [
          { t: "Stay inside with windows and doors closed", d: "Close the AC's fresh-air intake or set it to recirculate, and run a swamp cooler as little as you can. Take it easy: less activity means less smoke breathed in. Too hot? Heat comes first.", s: "epaheatsmoke", go: "heat" },
          { t: "Make a clean room", d: "A bedroom with few windows and no fireplace, with a HEPA air cleaner sized for the room that makes no ozone. Stopgap: a MERV 13 filter on a 2012-or-newer box fan. Older fans can catch fire: never run one unattended or while you sleep.", s: "epacleanroom" },
          { t: "Don't add smoke indoors", d: "No candles, frying or broiling, smoking or vacuuming.", s: "epasmoke" },
          { t: "Outside, wear a fitted N95", d: "It must say NIOSH. Both straps on, nose clip pinched; it only helps if it seals. Beards break the seal, and none fit young kids. Heart or lung problems, or pregnant? Ask a doctor. Dizzy? Get to cleaner air and take it off.", s: "epalungs" },
          { t: "In the car, set the AC to recirculate", s: "epasmoke2" },
          { t: "Chest pain or severe trouble breathing: call 911", d: "Other trouble breathing or a cough that won't stop: call your doctor. People with heart or lung disease are at higher risk.", s: "cdcsmokeheart" }
        ] },
        { label: "SET: be ready to leave", items: [
          { t: "Go-bags, medicines and the binder by the door", d: "Be ready to leave the moment you're told.", s: "maricopa" },
          { t: "Text your out-of-area contact the plan", href: "#/comms" }
        ] },
        { label: "GO: leave", items: [
          { t: "Leave right away with everyone and the pets", s: "maricopa" },
          { t: "Follow instructions from emergency crews and their routes", s: "azein" },
          { t: "Text \"OK + location\" once you're out", href: "#/comms" }
        ] }
      ]
    },
    {
      id: "boil", title: "Boil-water notice", sub: "Tap water isn't safe to drink until boiled", icon: "drop",
      trigger: "Your water provider or the city issues a boil-water advisory.",
      ruleTitle: "Hard rule until the notice is lifted",
      leave: ["Only bottled or boiled water for drinking, cooking, ice, brushing teeth, baby formula and pets.", "Home water filters don't make it safe: most don't remove bacteria or viruses."],
      sources: ["cdcboil", "cdcwater", "cdcstore", "ctflush"],
      phases: [
        { label: "Make water safe", items: [
          { t: "Check the notice type", d: "\"Do not drink\" or \"Do not use\" means boiling won't help: use bottled or stored water.", s: "cdcboil" },
          { t: "Boil: a rolling boil for 1 full minute, then let it cool", d: "Store it in clean, covered containers. Above 6,500 feet (Flagstaff, not Phoenix), boil 3 minutes.", s: "cdcwater" },
          { t: "Can't boil? Use unscented bleach", d: "Check the label: 5% to 9%. 8 drops (just under 1/8 teaspoon) per gallon of clear water. Cloudy? Filter it or let it settle first, then use 16 drops. Stir and wait at least 30 minutes. Boiling kills more germs.", s: "cdcwater" },
          { t: "Water you stored before the problem began can be used", d: "Your drums and bricks, if sealed and filled within the last 6 months. Unsure? Boil or treat it.", s: "cdcstore" }
        ] },
        { label: "Around the house", items: [
          { t: "Food and drinks", d: "Wash produce and make coffee, tea and formula with boiled or bottled water; ready-to-use formula is best. Throw out ice made from tap water, and don't use the fridge's water or ice dispenser.", s: "cdcboil" },
          { t: "Dishes", d: "By hand: wash and rinse, then soak 1 minute in 1 teaspoon of unscented bleach per gallon of warm water, and air-dry. A dishwasher is fine if it has a sanitizing cycle.", s: "cdcboil" },
          { t: "Bathing", d: "Showers are fine; don't swallow the water. Give babies and young children a sponge bath.", s: "cdcboil" },
          { t: "Handwashing and laundry", d: "Soap and tap water are fine for handwashing in most cases. Do laundry as usual.", s: "cdcboil" }
        ] },
        { label: "When the notice is lifted", items: [
          { t: "Flush the pipes", d: "Follow your water provider's steps. If they give none: run each cold tap 5 minutes, throw out 3 batches of ice, and replace fridge and faucet filters.", s: "ctflush" }
        ] }
      ]
    }
  ],

      const st = v === Infinity ? "solar" : E.status(v);
      const hgt = v === null ? 14 : v === Infinity ? 150 : 16 + Math.min(v, 30) / 30 * 138;
      const y = ground, top = y - hgt;
      const L = [[x - w / 2, y], [x, y + d / 2], [x, top + d / 2], [x - w / 2, top]];
      const R = [[x, y + d / 2], [x + w / 2, y], [x + w / 2, top], [x, top + d / 2]];
      const T = [[x - w / 2, top], [x, top + d / 2], [x + w / 2, top], [x, top - d / 2]];
      const pts = (a) => a.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
      const c = color[st];
      const ghost = v === null;
      out += '<g class="twlink" data-go="#/supplies' + (k === "power" || k === "meds" || k === "water" || k === "food" ? "?cat=" + k : "") + '" tabindex="0" role="link" aria-label="' + RES[k].label + " " + fmtDays(v) + ' days">';
      out += '<g class="tw" style="animation-delay:' + (i * 0.07).toFixed(2) + "s," + (-i * 1.7).toFixed(1) + 's">';
      out += '<ellipse cx="' + x + '" cy="' + (y + d / 2 + 2) + '" rx="' + (w * 0.72) + '" ry="9" style="fill:' + c + '" opacity="' + (ghost ? 0.05 : 0.16) + '"/>';
      if (ghost) {
        out += '<polygon points="' + pts(L) + '" fill="none" style="stroke:var(--none)" stroke-dasharray="3 3"/><polygon points="' + pts(R) + '" fill="none" style="stroke:var(--none)" stroke-dasharray="3 3"/><polygon points="' + pts(T) + '" fill="none" style="stroke:var(--none)" stroke-dasharray="3 3"/>';
      } else {
        out += '<polygon points="' + pts(L) + '" fill="url(#g' + k + ')" style="stroke:' + c + '" stroke-opacity=".75" stroke-width="1"/>';
        out += '<polygon points="' + pts(R) + '" fill="url(#g' + k + ')" opacity=".72" style="stroke:' + c + '" stroke-opacity=".55" stroke-width="1"/>';
        out += '<polygon points="' + pts(T) + '" style="fill:' + c + ';stroke:#fff" fill-opacity=".55" stroke-opacity=".7" stroke-width="1"/>';
        out += '<line x1="' + (x - w / 2 + 3) + '" y1="' + (top + 4) + '" x2="' + (x - w / 2 + 3) + '" y2="' + (y - 6) + '" stroke="#fff" stroke-opacity=".38" stroke-width="1.4"/>';
      }
      out += '<text x="' + x + '" y="' + (top - d / 2 - 10) + '" text-anchor="middle" style="fill:var(--ink);font:300 22px var(--mono)">' + fmtDays(v) + "</text>";
      out += "</g>";
      out += '<text x="' + x + '" y="' + (ground + 38) + '" text-anchor="middle" style="fill:var(--ink2);font:600 10.5px var(--mono);letter-spacing:.16em">' + RES[k].label.toUpperCase() + "</text>";
      out += '<text x="' + x + '" y="' + (ground + 53) + '" text-anchor="middle" style="fill:' + c + ';font:600 9px var(--mono);letter-spacing:.14em">' + (st === "solar" ? "SOLAR" : STATUS_WORD[st]) + "</text>";
      out += "</g>";
    });
    return out + "</svg>";
  }

  /* ---------------- EMERGENCY ---------------- */
  const cardView = { id: null, step: 0, beatStep: 0, autoBeat: false };
  function emTop() {

  function renderEmergency() {
    const id = route.parts[1];

  function renderCard(id) {
    const c = C.cards.find((x) => x.id === id);
    if (!c) return renderEmergency();
    if (cardView.id !== id) { cardView.id = id; cardView.step = 0; }
    const n = c.steps.length, i = Math.min(cardView.step, n - 1), s = c.steps[i];
    cardView.beatStep = s.beat || 0;
    let h = emTop();
    h += '<div class="emhead"><span>' + esc(c.title) + "</span><span>Step " + (i + 1) + " of " + n + "</span></div>";
    h += '<div class="dots">' + c.steps.map((_, k) => "<i" + (k <= i ? ' class="on"' : "") + "></i>").join("") + "</div>";
    h += '<div class="emstep">' + esc(s.t) + '</div><div class="emdet">' + esc(s.d) + "</div>";
    if (s.beat) {
      h += '<div class="beat" aria-hidden="true"><div><b>PUSH</b><small>' + s.beat + " / min</small></div></div>";
      h += '<div class="cprbar"><span>Time <b class="mono" id="cprtime">0:00</b> <span id="swap" class="swap hide">SWITCH</span></span>' +
        '<button data-act="beat-toggle">' + (Metro.on || cardView.autoBeat ? "Stop beat" : "Start beat") + "</button>" +
        '<button data-act="beat-sound">' + (Metro.sound ? "Sound on" : "Sound off") + "</button></div>";
    }
    if (s.call) h += '<a class="emlink" href="' + telHref(s.call.num) + '">' + ic("phone") + "Call " + esc(s.call.n) + "</a> ";
    if (s.link) h += '<a class="emlink" href="#/emergency/' + s.link + '" data-act="card-jump" data-card="' + s.link + '">Open ' + esc(C.cards.find((x) => x.id === s.link).title) + " card</a>";
    h += '<div class="emnav"><button data-act="step-prev"' + (i === 0 ? " disabled" : "") + ">BACK</button>" +
      (i < n - 1 ? '<button class="next" data-act="step-next">NEXT</button>' : '<a class="next" href="#/emergency">ALL CARDS</a>') + "</div>";
    if (c.note) h += '<div class="emnote">' + esc(c.note) + "</div>";
    if (c.noteLink) h += '<a class="emlink" href="#/emergency/' + c.noteLink + '" data-act="card-jump">Open ' + esc(C.cards.find((x) => x.id === c.noteLink).title) + " card</a>";

    return h;
  }
  function stepTo(delta) {
    const c = C.cards.find((x) => x.id === cardView.id); if (!c) return;
    cardView.step = Math.max(0, Math.min(c.steps.length - 1, cardView.step + delta));
    const s = c.steps[cardView.step];
    if (s.beat) { cardView.autoBeat = true; Snd.ctx(); } else { Metro.stop(); }
    render();
  }

  function logUse(id, n) {
    const i = byId("items", id); if (!i || !n) return;

    upsert("log", { id: uid(), t: now(), itemId: i.id, delta: n > 0 ? used : n, res: n > 0 && r.key ? i.category : null, amount: n > 0 ? used * per : 0 });

  // PDF reader: pdf.js renders pages to canvas on demand; pages far off screen are released to save memory.
  const PdfV = {
    lib: null, task: null, loadP: null, doc: null, id: null, n: 0, ratio: 1.294, zoom: 1, cur: 1, io: null, io2: null,
    vis: new Set(), rendered: new Map(), queue: [], busy: false, token: 0, ftoken: 0, text: null, outline: null, saveT: 0,
    async engine() {
      if (this.lib) return this.lib;
      const lib = await import("./pdfjs/pdf.min.js");
      lib.GlobalWorkerOptions.workerSrc = new URL("./pdfjs/pdf.worker.min.js", location.href).href;
      this.lib = lib; return lib;
    },
    msg(m) { const e = $("#pdfmsg"); if (e) { e.textContent = m || ""; e.classList.toggle("hide", !m); } },
    async load(id) {
      const tk = this.token;
      const blob = await Store.get("pdf:" + id);
      if (!blob) throw Object.assign(new Error("This PDF is missing on this phone. Import it again."), { name: "Missing" });
      const lib = await this.engine();
      const data = new Uint8Array(await blob.arrayBuffer());
      if (tk !== this.token) return;
      this.task = lib.getDocument({ data, useWorkerFetch: false, useWasm: false, isEvalSupported: false, verbosity: 0 });
      const doc = await this.task.promise;
      if (tk !== this.token) { doc.destroy(); return; }
      const v = (await doc.getPage(1)).getViewport({ scale: 1 });
      this.doc = doc; this.n = doc.numPages; this.text = new Map(); this.outline = null; this.ratio = v.height / v.width;
      const meta = LIB.find((d) => d.id === id);
      if (meta) { meta.pages = this.n; meta.opened = now(); saveLib(); }
    },
    async mount(id) {
      if (!$("#pdfpages")) return;
      try {
        if (this.id !== id) { await this.close(); this.id = id; this.loadP = this.load(id); }
        await this.loadP;
        if (!this.doc || this.id !== id || !$("#pdfpages")) return;
        this.msg("");
        this.layout($("#pdfpages"));
        const meta = LIB.find((d) => d.id === id);
        const start = Math.min(this.n, Math.max(1, (meta && meta.lastPage) || 1));
        this.setNum(start); if (start > 1) this.go(start);
      } catch (e) {
        if (this.id !== id) return;
        this.msg(e && e.name === "PasswordException" ? "This PDF is password-protected, so HAVYN can't open it." : e && e.name === "Missing" ? e.message : "Couldn't open this PDF" + (e && e.message ? ": " + e.message : "."));
      }
    },
    layout(box) {
      this.unobserve();
      for (const [, c] of this.rendered) if (c && c !== "busy") { c.width = 0; c.height = 0; }
      this.rendered = new Map(); this.vis = new Set(); this.queue = [];
      box.style.setProperty("--z", this.zoom);
      let html = ""; for (let i = 1; i <= this.n; i++) html += '<div class="pg" data-n="' + i + '" style="aspect-ratio:1 / ' + this.ratio.toFixed(4) + '"></div>';
      box.innerHTML = html;
      this.io = new IntersectionObserver((ents) => {
        for (const e of ents) { const n = +e.target.dataset.n; if (e.isIntersecting) { this.vis.add(n); this.want(n); } else { this.vis.delete(n); this.free(n); } }
        this.pump();
      }, { rootMargin: "120% 0px" });
      this.io2 = new IntersectionObserver((ents) => { for (const e of ents) if (e.isIntersecting) this.setNum(+e.target.dataset.n); }, { rootMargin: "-45% 0px -54% 0px" });

    },
    want(n) { if (!this.rendered.has(n) && !this.queue.includes(n)) this.queue.push(n); },
    free(n) {
      const c = this.rendered.get(n);
      if (c && c !== "busy") { c.width = 0; c.height = 0; c.remove(); this.rendered.delete(n); }
      const i = this.queue.indexOf(n); if (i >= 0) this.queue.splice(i, 1);
    },
    async pump() {
      if (this.busy || !this.doc) return;
      this.busy = true;
      try {
        while (this.queue.length && this.doc) {
          this.queue.sort((a, b) => Math.abs(a - this.cur) - Math.abs(b - this.cur));
          const n = this.queue.shift();
          if (this.vis.has(n) && !this.rendered.has(n)) await this.draw(n);
        }
      } catch (e) {} finally { this.busy = false; }
    },

      '<div class="kv"><span>PDF library</span><span>' + LIB.length + (LIB.length === 1 ? " file" : " files") + " · " + mb(LIB.reduce((a, x) => a + (x.size || 0), 0)) + "</span></div>" +
      '<div class="kv"><span>Network use</span><span>None (blocked by policy)</span></div>' +
      '<div class="kv"><span>Version</span><span class="mono">' + esc(VERSION) + "</span></div>" +
      '<p class="empty" style="font-size:.85rem">Deleting the app icon deletes its data. Keep Memory Cards on another phone and the vault drive.</p></section>';
    h += '<section class="glass panel"><h3>Danger zone</h3><button class="btn ghost danger wide" data-act="erase">Erase everything on this phone</button></section>';
    return h;
  }
  async function sha256(text) {
    try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)); return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, "0")).join(""); } catch (e) { return ""; }
  }
  function snapshot() { return JSON.parse(JSON.stringify({ settings: S.settings, plan: S.plan, outage: S.outage, checks: S.checks, people: S.people, pets: S.pets, items: S.items, log: S.log, tasks: S.tasks, buys: S.buys })); }
  async function allPhotos() {
    const out = {}; const keys = (await Store.keys()) || [];
    for (const k of keys) if (String(k).startsWith("photo:")) out[String(k).slice(6)] = await Store.get(k);
    return out;
  }
  async function prepareCard() {
    const bar = $("#mcbar"), msg = $("#mcmsg");
    const step = (p, m) => { if (bar) bar.style.width = p + "%"; if (msg) msg.textContent = m; };
    if (PREVIEW) { step(100, "Preview only. The installed app saves the card here and sends it by AirDrop or Files."); return; }
    step(15, "Saving data. Do not close the app.");
    const data = snapshot();
    const json = JSON.stringify(data);
    const card = { format: "havyn.memorycard", version: 1, app: "HAVYN FIELD " + VERSION, exported: new Date().toISOString(), device: PR.deviceName || "", checksum: await sha256(json), data, photos: await allPhotos() };
    step(70, "Writing Memory Card…");
    const name = "HAVYN-MemoryCard-" + ymd(now()) + "-" + (PR.deviceName || "phone").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".json";
    preparedFile = new File([JSON.stringify(card)], name, { type: "application/json" });
    PR.lastBackup = now(); flush();
    setTimeout(() => { step(100, "Complete. " + name + " (" + fmtN(preparedFile.size / 1024, 0) + " KB)"); Snd.chime("save"); const s = $("#mcsend"); if (s) s.classList.remove("hide"); }, 260);
  }
  async function shareCard() {
    if (!preparedFile) return;
    if (navigator.canShare && navigator.canShare({ files: [preparedFile] })) {
      try { await navigator.share({ files: [preparedFile], title: "HAVYN Memory Card" }); toast("Sent"); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    downloadCard();
  }
  function downloadCard() {
    if (!preparedFile) return;
    const url = URL.createObjectURL(preparedFile); const a = document.createElement("a");
    a.href = url; a.download = preparedFile.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  async function readCardFile(file) {
    if (!file) return;
    if (file.size > 60 * 1024 * 1024) { toast("That file is too large to be a Memory Card"); return; }
    let card;
    try { card = JSON.parse(await file.text()); } catch (e) { toast("Not a Memory Card file"); return; }
    if (!card || card.format !== "havyn.memorycard" || !card.data) { toast("Not an HAVYN Memory Card"); return; }
    let warn = "";
    if (card.checksum) { const sum = await sha256(JSON.stringify(card.data)); if (sum && sum !== card.checksum) warn = " Checksum mismatch: the file may be damaged."; }
    const data = E.sanitize(card.data);
    const dry = E.merge(snapshot(), data).report;
    pendingCard = { device: card.device, exported: card.exported, data, photos: card.photos && typeof card.photos === "object" ? card.photos : {}, preview: dry.added + " new and " + dry.updated + " newer records." + warn };
    render();
  }
  async function applyCard(mode) {
    if (!pendingCard) return;
    if (mode === "replace") { const d = defaults(); S = Object.assign(d, Object.fromEntries(Object.entries(pendingCard.data).filter(([, v]) => v !== undefined))); S.settings = Object.assign(defaults().settings, S.settings || {}); S.plan = Object.assign(defaults().plan, S.plan || {}); }
    else S = Object.assign(S, E.merge(snapshot(), pendingCard.data).state);
    for (const [id, url] of Object.entries(pendingCard.photos)) if (typeof url === "string" && url.startsWith("data:image/") && /^[\w-]+$/.test(id)) await Store.set("photo:" + id, url);
    pendingCard = null; flush(); Snd.chime("ok"); toast("Memory Card loaded"); render();
  }

  /* ---------------- photos ---------------- */
  function hydratePhotos() {
    $$("img[data-photo]").forEach(async (img) => { const u = await Store.get("photo:" + img.dataset.photo); if (u) img.src = u; else img.remove(); });
  }
  function shrinkPhoto(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => {
        const im = new Image();
        im.onload = () => { const m = 1280, k = Math.min(1, m / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", 0.72)); };
        im.onerror = rej; im.src = r.result;
      };
      r.onerror = rej; r.readAsDataURL(file);
    });
  }

  /* ---------------- example household ---------------- */
  function loadExample() {
    const ex = (o) => Object.assign(o, { id: uid(), example: true, updated: now() });
    S.people.push(ex({ name: "Parent A", ageBand: "adult" }), ex({ name: "Parent B", ageBand: "adult", meds: "Rescue inhaler" }), ex({ name: "Teen", ageBand: "teen" }), ex({ name: "Kid", ageBand: "child", allergies: "Peanuts: epinephrine in kitchen drawer" }));
    S.pets.push(ex({ name: "Dog", species: "Dog", weightLb: 45 }));
    const soon = ymd(now() + 40 * DAY), later = ymd(now() + 400 * DAY);
    S.items.push(
      ex({ category: "water", name: "55-gal drum", qty: 2, per_unit: { gal: 55 }, location: "Hall closet", expires: ymd(now() + 300 * DAY) }),
      ex({ category: "water", name: "WaterBrick 3.5 gal", qty: 4, per_unit: { gal: 3.5 }, location: "Bedroom closet" }),
      ex({ category: "water", name: "Case: 24 bottles", qty: 2, per_unit: { gal: 3.17 }, location: "Garage shelf" }),
      ex({ category: "food", name: "Rice, 20 lb", qty: 1, per_unit: { kcal: 32000 }, location: "Pantry", expires: later }),
      ex({ category: "food", name: "Canned meals", qty: 24, per_unit: { kcal: 450 }, location: "Pantry", expires: later }),
      ex({ category: "food", name: "Granola bars, box", qty: 3, per_unit: { kcal: 1200 }, location: "Pantry", expires: soon }),
      ex({ category: "meds", name: "Rescue inhaler", qty: 1, per_unit: { doses: 200 }, per_day: 4, critical: true, location: "Kitchen drawer", expires: later }),
      ex({ category: "power", name: "1 kWh station", qty: 1, per_unit: { wh: 1024 }, location: "Office" }),
      ex({ category: "power", name: "Power bank 20,000 mAh", qty: 4, per_unit: { wh: 74 }, location: "Go-bags" }),
      ex({ category: "gear", name: "Headlamp", qty: 4, location: "Go-bags" }),
      ex({ category: "gear", name: "CO alarm (battery)", qty: 3, location: "Hallways" })
    );
    S.plan = Object.assign({}, S.plan, { contactName: "Aunt in Tucson (example)", contactPhone: "555-0100", rally1: "Front of the house", rally2: "Park at the corner", rally3: "Aunt's house, Tucson", leaveTo: "Hotel on another grid", updated: now() });
    save(); toast("Example household loaded"); Snd.chime("ok"); render();
  }
  function clearExample() {
    for (const k of ["people", "pets", "items"]) S[k] = S[k].map((r) => (r.example ? { id: r.id, deleted: true, updated: now() } : r));
    if ((S.plan.contactName || "").includes("(example)")) S.plan = Object.assign(defaults().plan, { updated: now() });
    save(); toast("Example data removed"); render();
  }

  /* ---------------- events ---------------- */
  let toastTimer = 0;
  function toast(msg) {
    let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.textContent = msg; el.classList.remove("hide"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add("hide"), 2400);
  }
  const armed = {};
  function confirmTap(btn, key, label) {
    if (armed[key] && now() - armed[key] < 4000) { delete armed[key]; return true; }
    armed[key] = now(); btn.textContent = label; Snd.chime("warn");
    setTimeout(() => { if (armed[key]) { delete armed[key]; render(); } }, 4000);
    return false;
  }
  document.addEventListener("click", (ev) => {
    const dg = ev.target.closest("[data-go]"); if (dg) { location.hash = dg.dataset.go; return; }
    const pre = ev.target.closest("[data-preset]");
    if (pre) { const [n, v] = pre.dataset.preset.split("|"); const f = pre.closest("form"); const nm = f.querySelector("[name=name]"), pv = f.querySelector("[name=per]"); if (nm) nm.value = n; if (pv) pv.value = v; return; }
    const b = ev.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act;
    if (act === "night") { PR.theme = PR.theme === "night" ? "void" : "night"; flush(); render(); }
    else if (act === "outage-start") { setOne("outage", { active: true, startedAt: now(), endedAt: 0 }); Snd.chime("warn"); toast("Outage clock started"); render(); }
    else if (act === "outage-stop") { setOne("outage", { active: false, endedAt: now() }); Snd.chime("ok"); toast("Outage ended: " + dur(now() - S.outage.startedAt)); render(); }
    else if (act === "example") loadExample();
    else if (act === "clear-example") clearExample();
    else if (act === "hide-install") { PR.installHidden = true; flush(); render(); }
    else if (act === "step-next") { ev.preventDefault(); stepTo(1); }
    else if (act === "step-prev") { ev.preventDefault(); stepTo(-1); }
    else if (act === "card-jump") { cardView.id = null; Metro.stop(); }
    else if (act === "beat-toggle") { if (Metro.on) { Metro.stop(); cardView.autoBeat = false; } else { cardView.autoBeat = true; Metro.start(cardView.beatStep || 110); } b.textContent = Metro.on ? "Stop beat" : "Start beat"; }
    else if (act === "beat-sound") { Metro.sound = !Metro.sound; if (Metro.on) Metro.start(cardView.beatStep || 110); b.textContent = Metro.sound ? "Sound on" : "Sound off"; }
    else if (act === "reset-checks") { const c = Object.assign({}, S.checks); delete c[b.dataset.id]; S.checks = touch(c); save(); render(); }
    else if (act === "use") logUse(b.dataset.id, num(b.dataset.n)), render();
    else if (act === "del") { if (confirmTap(b, "del" + b.dataset.id, "Tap again to delete")) { remove(b.dataset.coll, b.dataset.id); toast("Deleted"); go(b.dataset.coll === "items" ? "#/supplies" : "#/family"); } }
    else if (act === "up-done") { const r = recOf("tasks", b.dataset.id) || {}; setTask(b.dataset.id, { prevDone: r.lastDone || 0, lastDone: now() }); Snd.chime("ok"); toast("Marked done"); render(); }
    else if (act === "up-undo") { const r = recOf("tasks", b.dataset.id) || {}; setTask(b.dataset.id, { lastDone: r.prevDone || 0, prevDone: 0 }); render(); }
    else if (act === "task-del") { if (confirmTap(b, "task" + b.dataset.id, "Tap again to remove")) { remove("tasks", b.dataset.id); toast("Removed"); render(); } }
    else if (act === "buy-status") { setBuy(b.dataset.id, { status: b.dataset.v }); Snd.chime(b.dataset.v === "have" ? "ok" : "nav"); render(); }
    else if (act === "buy-auto") { setBuy(b.dataset.id, { qty: null }); render(); }
    else if (act === "buy-add") {
      const r = E.buyPlan(S, C.buy.items).rows.find((x) => x.item.id === b.dataset.id); if (!r || !r.item.add) return;
      const a = r.item.add, cat = RES[a.cat] ? a.cat : "gear", key = RES[cat].key;
      const vals = { category: cat, name: a.name || r.item.n, qty: r.qty !== null ? r.qty : 1, notes: r.item.pick };
      if (key && a.per) { vals.per_unit = {}; vals.per_unit[key] = a.per; }
      draft = { id: "", vals, fromBuy: r.item.id }; go("#/supplies/edit/new?cat=" + cat);
    }
    else if (act === "buy-solar") { const r = E.buyPlan(S, C.buy.items).rows.find((x) => x.item.id === b.dataset.id); const w = 200 * ((r && r.qty) || 1); setOne("settings", { solarW: Math.max(num(S.settings.solarW), w) }); toast("Solar set to " + w + " W"); Snd.chime("ok"); render(); }
    else if (act === "pdf-toc") PdfV.toc();
    else if (act === "pdf-find") PdfV.findPanel();
    else if (act === "pdf-zoom") PdfV.setZoom(num(b.dataset.z));
    else if (act === "pdf-dest") PdfV.dest(num(b.dataset.i));
    else if (act === "pdf-go") { const pn = $("#pdfpanel"); if (pn) pn.classList.add("hide"); PdfV.go(num(b.dataset.n)); }
    else if (act === "pdf-del") { if (confirmTap(b, "pdfdel", "Tap again to delete")) deletePdf(b.dataset.id); }
    else if (act === "binder-pdf") { b.disabled = true; makeBinderPdf().catch((e) => { const m = $("#bdmsg"); if (m) m.textContent = "Couldn't make the PDF: " + (e && e.message ? e.message : e); }).finally(() => { b.disabled = false; }); }
    else if (act === "binder-share") shareBinder();
    else if (act === "binder-dl") downloadBinder();
    else if (act === "binder-print") window.print();
    else if (act === "mc-save") prepareCard();
    else if (act === "mc-share") shareCard();
    else if (act === "mc-download") downloadCard();
    else if (act === "mc-merge") applyCard("merge");
    else if (act === "mc-replace") { if (confirmTap(b, "replace", "Tap again: replace everything")) applyCard("replace"); }
    else if (act === "mc-cancel") { pendingCard = null; render(); }
    else if (act === "erase") { if (confirmTap(b, "erase", "Tap again to erase this phone")) eraseAll(); }
  });
  document.addEventListener("keydown", (ev) => { const g = ev.target.closest && ev.target.closest("[data-go]"); if (g && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); location.hash = g.dataset.go; } });
  document.addEventListener("change", async (ev) => {
    const t = ev.target;
    if (t.dataset && t.dataset.chk) {
      const [pid, k] = t.dataset.chk.split("|"); const c = Object.assign({}, S.checks); c[pid] = Object.assign({}, c[pid]); if (t.checked) c[pid][k] = now(); else delete c[pid][k];
      S.checks = touch(c); save(); t.closest(".chk").classList.toggle("done", t.checked); if (t.checked) Snd.chime("nav"); return;
    }
    if (t.dataset && t.dataset.task) {
      setTask(t.dataset.task, { done: t.checked, doneAt: t.checked ? now() : 0 });
      if (t.checked) Snd.chime("ok"); render(); return;
    }
    if (t.id === "mcfile") { await readCardFile(t.files && t.files[0]); t.value = ""; return; }
    if (t.id === "pdffile") { const fs = Array.from(t.files || []); t.value = ""; await importPdfs(fs); return; }
    if (t.dataset && t.dataset.photoFor) {
      const f = t.files && t.files[0]; if (!f) return;
      try { const url = await shrinkPhoto(f); const id = uid(); await Store.set("photo:" + id, url); const old = S.plan[t.dataset.photoFor + "Photo"]; if (old) Store.del("photo:" + old); const p = {}; p[t.dataset.photoFor + "Photo"] = id; setOne("plan", p); toast("Photo saved"); render(); } catch (e) { toast("Could not read that photo"); }
      return;
    }
    const form = t.closest && t.closest("form[data-form=item]");
    if (form && t.name === "category") { draft = { id: form.dataset.id || "", vals: formVals(form), fromBuy: draft && draft.fromBuy }; render(); }
  });
  function formVals(f) { const o = {}; new FormData(f).forEach((v, k) => { o[k] = typeof v === "string" ? v.trim() : v; }); return o; }
  document.addEventListener("submit", (ev) => {
    const f = ev.target.closest("form[data-form]"); if (!f) return;
    ev.preventDefault();
    const v = formVals(f), kind = f.dataset.form, id = f.dataset.id;
    if (kind === "person") {
      const p = Object.assign({}, id ? byId("people", id) : { id: uid() }, { name: v.name, ageBand: v.ageBand, conditions: v.conditions, meds: v.meds, allergies: v.allergies, blood: v.blood, kcal: optNum(v.kcal), doctor: v.doctor, device: v.device, notes: v.notes });
      delete p.example; upsert("people", p); toast("Saved"); Snd.chime("ok"); go("#/family");
    } else if (kind === "pet") {
      const p = Object.assign({}, id ? byId("pets", id) : { id: uid() }, { name: v.name, species: v.species, weightLb: optNum(v.weightLb), notes: v.notes });
      delete p.example; upsert("pets", p); toast("Saved"); Snd.chime("ok"); go("#/family");
    } else if (kind === "plan") {
      const checkins = [v.c1, v.c2, v.c3].filter(Boolean);
      setOne("plan", { contactName: v.contactName, contactPhone: v.contactPhone, rally1: v.rally1, rally2: v.rally2, rally3: v.rally3, leaveTo: v.leaveTo, leaveNotes: v.leaveNotes, gas: v.gas, water: v.water, power: v.power, gmrsCh: v.gmrsCh, meshCh: v.meshCh });
      setOne("settings", { checkins }); toast("Plan saved"); Snd.chime("ok"); go("#/family");
    } else if (kind === "item") {
      const cat = RES[v.category] ? v.category : "gear", r = RES[cat];
      const base = id ? byId("items", id) : { id: uid() };
      const it = Object.assign({}, base, { category: cat, name: v.name || r.label, qty: num(v.qty), location: v.location, expires: v.expires, min_qty: optNum(v.min_qty), notes: v.notes });
      it.per_unit = r.key ? (() => { const o = {}; o[r.key] = num(v.per); return o; })() : {};
      if (cat === "meds") { it.per_day = num(v.per_day); it.critical = v.critical === "yes"; it.owner = v.owner; } else { delete it.per_day; delete it.critical; delete it.owner; }
      const fromBuy = draft && draft.fromBuy;
      delete it.example; draft = null; upsert("items", it); if (fromBuy) setBuy(fromBuy, { itemId: it.id, status: "have" }); toast("Saved"); Snd.chime("ok"); go("#/supplies/item/" + it.id);
    } else if (kind === "task") {
      if (!v.t) { toast("Type what needs doing"); return; }
      upsert("tasks", { id: uid(), custom: true, t: String(v.t).slice(0, 200), phase: C.missions.phases.some((x) => x.id === v.phase) ? v.phase : "week", done: false });
      toast("Mission added"); Snd.chime("ok"); render();
    } else if (kind === "buyqty") {
      setBuy(id, { qty: String(v.qty || "").trim() === "" ? null : Math.max(0, num(v.qty)) }); toast("Quantity saved"); render();
    } else if (kind === "pdfgo") {
      const n = Math.round(num(v.p)); const inp = f.querySelector("input"); if (inp) { inp.value = ""; inp.blur(); }
      if (n >= 1 && n <= PdfV.n) PdfV.go(n); else toast("Pages 1 to " + PdfV.n);
    } else if (kind === "pdffind") {
      const inp = f.querySelector("input"); if (inp) inp.blur(); PdfV.search(v.q);
    } else if (kind === "use") {
      logUse(id, num(v.n)); render();
    } else if (kind === "settings") {
      setOne("settings", { season: v.season, targetDays: num(v.targetDays) || 14, loadWhNormal: num(v.loadWhNormal), loadWhHeat: num(v.loadWhHeat), solarW: num(v.solarW), sunHours: num(v.sunHours) });
      PR.deviceName = v.deviceName; PR.sound = v.sound === "on"; flush(); toast("Settings saved"); Snd.chime("ok"); render();
    }
  });
  // Swipe left/right on emergency cards.
  let sx = 0, sy = 0;
  document.addEventListener("touchstart", (e) => { if (!document.body.classList.contains("em")) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (!document.body.classList.contains("em") || !cardView.id) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) stepTo(dx < 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener("click", (e) => { const t = e.target.closest(".tab, a.li"); if (t && !document.body.classList.contains("em")) Snd.chime("nav"); }, true);
  window.addEventListener("hashchange", render);
  document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); else if (document.body.classList.contains("em")) Wake.on(); });

  async function eraseAll() {
    await PdfV.close(); LIB = [];
    const keys = (await Store.keys()) || [];
    for (const k of keys) await Store.del(k);
    S = defaults(); PR = prefDefaults(); preparedFile = null; pendingCard = null; flush(); toast("Erased"); go("#/status");
  }

  /* ---------------- ticking clocks ---------------- */
  function tick() {
    const o = $("[data-tick=outage]"); if (o && S.outage.active) o.textContent = dur(now() - S.outage.startedAt);
    const c = $("[data-tick=checkin]"); if (c) { const n = E.nextCheckin(S.settings.checkins, now()); if (n) c.textContent = "in " + Math.floor(n.inMin / 60) + "h " + (n.inMin % 60) + "m"; }
  }
  setInterval(tick, 1000);

  /* ---------------- boot ---------------- */
  async function boot() {
    await Store.open();
    const st = await Store.get("state"), pr = await Store.get("prefs");
    if (st && typeof st === "object") { const d = defaults(); S = Object.assign(d, st); S.settings = Object.assign(d.settings, st.settings || {}); S.plan = Object.assign(d.plan, st.plan || {}); }
    if (pr && typeof pr === "object") PR = Object.assign(prefDefaults(), pr);
    const lib = await Store.get("lib"); LIB = Array.isArray(lib) ? lib.filter((x) => x && typeof x.id === "string") : [];
    const v = $(".void"); if (v && !v.children.length) for (let i = 0; i < 14; i++) { const m = document.createElement("i"); m.style.left = (5 + Math.random() * 90) + "%"; m.style.top = (40 + Math.random() * 55) + "%"; m.style.animationDelay = (-Math.random() * 22).toFixed(1) + "s"; v.appendChild(m); }
    render();
    document.body.dataset.ready = "1";
    window.__HAVYN_READY_MS = Math.round(performance.now() - t0); window.__HAVYN_READY_AT = Math.round(performance.now());
    if (!PREVIEW && "serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").then(() => navigator.serviceWorker.ready).then(() => { const s = $("#swst"); if (s) s.textContent = "Saved for offline"; }).catch(() => { const s = $("#swst"); if (s) s.textContent = "Not available"; });
    }
  }
  window.__HAVYN = { get state() { return S; }, get prefs() { return PR; }, E, C, version: VERSION };
  boot();
})();
